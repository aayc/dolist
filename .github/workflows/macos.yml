name: macOS app

# The native Swift app (apps/macos): every Swift package's tests, integration tests against the
# real daemon (mock agent), and a release build of "Daily Do List.app" with the bundled daemon,
# uploaded as an artifact. Runs when the app, the daemon or what the daemon bundles changes (keep
# both path lists in sync).
on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/daemon/**"
      - "packages/core/**"
      - "packages/contract/**"
      - "packages/agent/**"
      - "packages/storage/**"
      - "packages/connectors/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/setup/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/daemon/**"
      - "packages/core/**"
      - "packages/contract/**"
      - "packages/agent/**"
      - "packages/storage/**"
      - "packages/connectors/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/setup/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: macOS app (Swift)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Select the newest Xcode
        # The packages need a recent Swift 6 toolchain; runner images ship several Xcodes. With
        # Xcode selected, test.sh adds no Command Line Tools flags.
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -n 1 || true)"
          if [ -d "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          swift --version
          node --version

      - name: Build the daemon
        run: pnpm --filter @ddl/daemon build

      - name: Swift package tests
        run: apps/macos/scripts/test.sh

      - name: Integration tests (real daemon, mock agent)
        run: apps/macos/scripts/test.sh integration

      - name: Build the app (release, bundled daemon)
        run: apps/macos/scripts/build-app.sh --release --with-daemon --zip

      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-do-list-macos
          path: "apps/macos/build/Daily Do List.zip"
          if-no-files-found: error
          retention-days: 14
