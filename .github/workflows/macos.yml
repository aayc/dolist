name: macOS app

# The native Swift app (apps/macos): every Swift package's tests, integration tests against the
# real daemon (mock agent), and a release build of "Daily Do List.app" with the bundled daemon,
# uploaded as an artifact. Runs when the app, the daemon, what the daemon bundles or the vim
# behavior vectors the Swift engine replays change (keep both path lists in sync).
on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/daemon/**"
      - "apps/sync/**"
      - "packages/core/**"
      - "packages/contract/**"
      - "packages/agent/**"
      - "packages/storage/**"
      - "packages/connectors/**"
      - "packages/editor/test/vim/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/setup/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/daemon/**"
      - "apps/sync/**"
      - "packages/core/**"
      - "packages/contract/**"
      - "packages/agent/**"
      - "packages/storage/**"
      - "packages/connectors/**"
      - "packages/editor/test/vim/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/setup/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: macOS app (Swift)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Select the newest Xcode
        # The packages need a recent Swift 6 toolchain; runner images ship several Xcodes. With
        # Xcode selected, test.sh adds no Command Line Tools flags.
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -n 1 || true)"
          if [ -d "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          swift --version
          node --version

      - name: Swift format (swift-format lint, strict)
        run: node scripts/lint.mjs --all --only swift

      - name: Build the daemon and the sync service
        # The integration tests run two synced daemons through the real sync service.
        run: pnpm --filter @ddl/daemon --filter @ddl/sync build

      - name: Swift package tests
        run: apps/macos/scripts/test.sh
        env:
          # Performance tests assert budgets calibrated on a dev machine, in the unoptimized test
          # build; the hosted macOS runner is a few times slower.
          PERF_BUDGET_MULTIPLIER: "4"
          EDITOR_PERF_BUDGET_MULTIPLIER: "2"

      - name: Shared packages build for iOS
        # The Foundation-only packages the planned iPhone app reuses must not pick up AppKit.
        # DailyDoListComputer (the ddl-computer helper) is macOS-only, so it isn't listed.
        # `package:scheme` builds one library of a package (DailyDoListDrawing's model; its
        # renderer and canvas are AppKit).
        run: |
          for entry in DailyDoListModels DailyDoListClient DailyDoListDomain DailyDoListVim \
            DailyDoListDrawing:DailyDoListDrawingModel; do
            pkg="${entry%%:*}"
            scheme="${entry#*:}"
            echo "::group::$scheme"
            (cd "apps/macos/Packages/$pkg" && xcodebuild build -quiet -scheme "$scheme" \
              -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO)
            echo "::endgroup::"
          done

      - name: Integration tests (real daemon, mock agent)
        run: apps/macos/scripts/test.sh integration

      - name: Build the app (release, bundled daemon)
        run: apps/macos/scripts/build-app.sh --release --with-daemon --zip

      - name: Smoke-test the bundled ddl-computer
        # Where the daemon looks for it, signed, and answering; passive methods only (no prompts).
        run: |
          helper="apps/macos/build/Daily Do List.app/Contents/Resources/daemon/bin/ddl-computer"
          codesign --verify --strict "$helper"
          out="$(printf '%s\n' '{"id":1,"method":"hello"}' '{"id":2,"method":"permissions"}' \
            | "$helper" serve)"
          echo "$out"
          echo "$out" | grep -q '^{"id":1,"result":{"version":1,'
          echo "$out" | grep -q '^{"id":2,"result":{"accessibility":'

      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-do-list-macos
          path: "apps/macos/build/Daily Do List.zip"
          if-no-files-found: error
          retention-days: 14
