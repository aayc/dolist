name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Every job restores turbo's cache (.github/actions/turbo-cache): a task whose inputs didn't change
  # replays its result. Main re-runs everything, so a cache-key mistake can't hide there.
  TURBO_FORCE: ${{ github.ref == 'refs/heads/main' }}
  TURBO_RUN_SUMMARY: "true"

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 of actionlint_<version>_linux_amd64.tar.gz, from the release's checksums.txt.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # The runner image's shellcheck is older than Homebrew's, and versions disagree on rules
      # (0.11 accepts POSIX.1-2024's `test -nt`). SHA-256 of the release's
      # shellcheck-v<version>.linux.x86_64.tar.xz (the project publishes no checksums file).
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: check
          step: restore

      - name: Install actionlint and shellcheck
        run: |
          bin_dir="$RUNNER_TEMP/lint-tools"
          mkdir -p "$bin_dir"
          actionlint="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$actionlint" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$actionlint" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$actionlint" -C "$bin_dir" actionlint
          shellcheck="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$shellcheck" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${shellcheck}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$shellcheck" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$shellcheck" -C "$bin_dir" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Lint (hygiene, Biome, shellcheck, actionlint, Swift vectors)
        # Swift formatting is linted by the macOS workflow, with Xcode's swift-format.
        run: pnpm lint --skip swift
      - name: Secret scan
        run: node scripts/check-secrets.mjs --all
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Bundle size budget
        run: node scripts/bundle-size-check.mjs

      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: check
          step: save

  test:
    # Each shard gets a runner of its own. On one, packages run one at a time (a runner has 4 vCPUs
    # and every package's Vitest starts a worker per core, so running them together makes
    # timing-sensitive tests many times slower than on a dev machine); TEST_TIME_SCALE stretches the
    # timing budgets and default timeouts for the rest.
    name: Unit tests (Linux, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: agent
            filter: --filter=@ddl/agent
          - shard: daemon
            filter: --filter=@ddl/daemon
          - shard: rest
            filter: --filter=!@ddl/agent --filter=!@ddl/daemon
    env:
      TEST_TIME_SCALE: "5"
      FILTER: ${{ matrix.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: test-${{ matrix.shard }}
          step: restore
      - name: Unit tests
        run: |
          # shellcheck disable=SC2086 # FILTER holds several arguments
          pnpm turbo run test --concurrency=1 --continue $FILTER
      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: test-${{ matrix.shard }}
          step: save

  test-macos:
    # What touches the OS: the agent's processes, shells, macOS computer-use helpers, Chrome and
    # files (src/execution, src/harness, its persistence tests); the FSEvents-backed file watcher
    # (storage); stdio servers (connectors); sockets (sync); case-insensitive paths and the Trash
    # (daemon). The rest is platform-independent logic and runs on Linux only.
    name: Unit tests (macOS, ${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: daemon
            cache: test-macos-daemon
            filter: --filter=@ddl/daemon
          - shard: agent and storage
            cache: test-macos-agent
            agent: true
            filter: --filter=@ddl/storage --filter=@ddl/connectors --filter=@ddl/sync
    env:
      TEST_TIME_SCALE: "5"
      FILTER: ${{ matrix.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: ${{ matrix.cache }}
          step: restore
      - name: Unit tests (the agent's OS-bound tests)
        if: matrix.agent
        run: >-
          pnpm turbo run test --filter=@ddl/agent --
          src/execution src/harness test/persistence test/journal.test.ts
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086 # FILTER holds several arguments
          pnpm turbo run test --concurrency=1 --continue $FILTER
      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.cache }}
          step: save

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_BUDGET_MULTIPLIER: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: bench
          step: restore

      - name: Run benchmarks
        # One package at a time so suites don't compete for the runner's CPUs. A cache hit restores
        # the package's bench-results.json.
        run: pnpm bench --concurrency=1
      - name: Check results
        if: ${{ !cancelled() }}
        run: node scripts/bench-check.mjs
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            packages/*/bench-results.json
            apps/*/bench-results.json
          if-no-files-found: warn
          retention-days: 30

      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: bench
          step: save

  e2e:
    # Playwright's web server builds the app and starts packages/agent/scripts/e2e-daemons.ts, which
    # runs a real daemon per test (mock agent or the fake model; no network). The functional suite
    # is split across runners by test.
    name: E2E (Playwright, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: e2e-${{ matrix.shard }}
          step: restore
      - name: Cached already?
        id: cached
        run: node .github/scripts/turbo-hit.mjs e2e --filter=@ddl/web -- "--shard=$SHARD"
      - uses: ./.github/actions/playwright
        if: steps.cached.outputs.hit != 'true'

      - name: Functional tests (real daemons)
        run: pnpm turbo run e2e --filter=@ddl/web -- "--shard=$SHARD"
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-functional-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.shard }}
          step: save

  perf:
    name: Perf (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PERF_BUDGET_MULTIPLIER: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: perf
          step: restore
      - name: Cached already?
        id: cached
        run: node .github/scripts/turbo-hit.mjs e2e:perf --filter=@ddl/web
      - uses: ./.github/actions/playwright
        if: steps.cached.outputs.hit != 'true'

      - name: Perf tests
        # A cache hit restores apps/web/perf-results.json, so the summary still shows the numbers.
        run: pnpm turbo run e2e:perf --filter=@ddl/web
      - name: Perf summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/perf-summary.mjs
      - name: Upload perf report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-perf
          path: |
            apps/web/perf-results.json
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: perf
          step: save

  vim:
    name: Vim mode (vectors, vim.js suite, replay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: vim
          step: restore
      - name: Cached already?
        id: cached
        run: node .github/scripts/turbo-hit.mjs vim:check --filter=@ddl/editor
      - uses: ./.github/actions/playwright
        if: steps.cached.outputs.hit != 'true'

      - name: Vim check
        run: pnpm turbo run vim:check --filter=@ddl/editor

      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: vim
          step: save

  evals-mock:
    name: Evals (mock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/turbo-cache
        with:
          name: evals
          step: restore

      - name: Run mock evals
        run: pnpm turbo run eval:mock --filter=@ddl/evals
      - name: Summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/eval-summary.mjs
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-mock
          path: evals/eval-results/
          if-no-files-found: warn
          retention-days: 30

      - uses: ./.github/actions/turbo-cache
        if: ${{ !cancelled() }}
        with:
          name: evals
          step: save
