name: Bug report
description: Something doesn't work as expected.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security vulnerabilities:** do not file them here. Report them privately from the repository's **Security** tab → **Report a vulnerability** (see `SECURITY.md`).

        **This repository is public.** Remove API keys, tokens, note contents, names, emails and file paths containing your username from everything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally reproducible with `pnpm dev:mock` and synthetic notes.
      placeholder: |
        1. Run `pnpm dev:mock` and open http://localhost:5173
        2. Open today's daily note (Mod+Shift+D)
        3. Type `- [ ] Book a table for two on Friday`
        4. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Daily notes
        - Agent / orchestrator / subagents
        - Safety evaluator / approvals
        - Storage / sync
        - Connectors (MCP)
        - Daemon / API
        - Performance
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent-mode
    attributes:
      label: Agent mode
      options:
        - live
        - mock
        - "off"
        - Not applicable
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a git SHA
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser and Node.js version.
      placeholder: macOS 26, Chrome 140, Node 24.4
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant daemon or browser console output, redacted.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
