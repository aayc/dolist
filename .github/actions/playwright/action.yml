name: Playwright browsers
description: >-
  Installs Playwright's Chromium (cached by the @playwright/test version in pnpm-lock.yaml) and its
  system dependencies. Run after the workspace setup.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: |
        version="$(grep -m1 -E "^  '?@playwright/test@[0-9]" pnpm-lock.yaml | cut -d@ -f3 | tr -d "':")"
        if [ -z "$version" ]; then
          echo "::error::@playwright/test not found in pnpm-lock.yaml"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Playwright browsers
      # System dependencies aren't cached, so this also runs on a cache hit (downloads are skipped).
      shell: bash
      run: pnpm --filter @ddl/web exec playwright install --with-deps chromium
