packages:
  - apps/web
  - apps/daemon
  - packages/*
  - evals

autoInstallPeers: true
strictPeerDependencies: false

# Native/postinstall scripts we explicitly trust. Everything else is blocked by pnpm 10's default.
onlyBuiltDependencies:
  - esbuild

# Versions shared by the workspace packages that use them and the daemon that bundles them.
catalog:
  "@earendil-works/pi-agent-core": 0.87.1
  "@earendil-works/pi-ai": 0.87.1
  "@earendil-works/pi-coding-agent": 0.87.1
  "@modelcontextprotocol/sdk": ^1.30.1
  "playwright-core": ^1.63.0
  "typebox": ^1.3.27
  "zod": ^4.6.5

# Small fixes to dependencies, kept as reviewable diffs in patches/ (see docs/PERFORMANCE.md).
patchedDependencies:
  "@codemirror/lang-markdown@6.5.2": patches/@codemirror__lang-markdown@6.5.2.patch
