name: DailyDoList
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  DailyDoListMobileIntegration:
    path: Packages/DailyDoListMobileIntegration
  DailyDoListMobileKit:
    path: Packages/DailyDoListMobileKit
  DailyDoListMobileSettings:
    path: Packages/DailyDoListMobileSettings
  DailyDoListWorkspaceCore:
    path: ../macos/Packages/DailyDoListWorkspaceCore
  DailyDoListModels:
    path: ../macos/Packages/DailyDoListModels
  DailyDoListClient:
    path: ../macos/Packages/DailyDoListClient
  DailyDoListDomain:
    path: ../macos/Packages/DailyDoListDomain
  DailyDoListEditor:
    path: ../macos/Packages/DailyDoListEditor
  DailyDoListAgent:
    path: ../macos/Packages/DailyDoListAgent
  DailyDoListDrawing:
    path: ../macos/Packages/DailyDoListDrawing
targets:
  DailyDoList:
    type: application
    platform: iOS
    sources: [Sources/DailyDoListMobile]
    configFiles:
      Debug: Resources/Signing.xcconfig
      Release: Resources/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dailydolist.iphone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Resources/Simulator.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daily Do List
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code from your Daily Do List host.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: .build/GeneratedInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.dailydolist.iphone
            CFBundleURLSchemes: [dolist]
        BGTaskSchedulerPermittedIdentifiers: [app.dailydolist.iphone.refresh]
        UIBackgroundModes: [fetch]
    dependencies:
      - package: DailyDoListMobileIntegration
      - package: DailyDoListMobileKit
      - package: DailyDoListMobileSettings
      - package: DailyDoListWorkspaceCore
      - package: DailyDoListModels
      - package: DailyDoListClient
      - package: DailyDoListDomain
      - package: DailyDoListEditor
        product: DailyDoListMobileEditor
      - package: DailyDoListEditor
        product: DailyDoListEditorCore
      - package: DailyDoListAgent
        product: DailyDoListAgentCore
      - package: DailyDoListAgent
        product: DailyDoListMobileAgent
      - package: DailyDoListDrawing
        product: DailyDoListDrawingModel
      - package: DailyDoListDrawing
        product: DailyDoListMobileDrawing
  DailyDoListTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Packages/DailyDoListMobileIntegration/Tests/DailyDoListMobileIntegrationTests, Packages/DailyDoListMobileKit/Tests/DailyDoListMobileKitTests, Packages/DailyDoListMobileSettings/Tests/DailyDoListMobileSettingsTests, ../macos/Packages/DailyDoListDrawing/Tests/DailyDoListMobileDrawingTests, ../macos/Packages/DailyDoListEditor/Tests/DailyDoListMobileEditorTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dailydolist.iphone.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DailyDoList
      - package: DailyDoListClient
        product: DailyDoListClientTestSupport
  DailyDoListUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dailydolist.iphone.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DailyDoList
schemes:
  DailyDoList:
    build:
      targets:
        DailyDoList: all
    test:
      targets:
        - DailyDoListTests
        - DailyDoListUITests
