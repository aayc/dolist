name: DailyDoList
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  DailyDoListMobileKit:
    path: Packages/DailyDoListMobileKit
  DailyDoListModels:
    path: ../macos/Packages/DailyDoListModels
  DailyDoListClient:
    path: ../macos/Packages/DailyDoListClient
  DailyDoListDomain:
    path: ../macos/Packages/DailyDoListDomain
  DailyDoListEditor:
    path: ../macos/Packages/DailyDoListEditor
  DailyDoListVim:
    path: ../macos/Packages/DailyDoListVim
  DailyDoListDrawing:
    path: ../macos/Packages/DailyDoListDrawing
targets:
  DailyDoList:
    type: application
    platform: iOS
    sources: [Sources/DailyDoListMobile]
    configFiles:
      Debug: Resources/Signing.xcconfig
      Release: Resources/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dailydolist.iphone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daily Do List
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: DailyDoListMobileKit
      - package: DailyDoListModels
      - package: DailyDoListClient
      - package: DailyDoListDomain
      - package: DailyDoListEditor
        product: DailyDoListMobileEditor
      - package: DailyDoListVim
      - package: DailyDoListDrawing
        product: DailyDoListDrawingModel
  DailyDoListTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Packages/DailyDoListMobileKit/Tests/DailyDoListMobileKitTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dailydolist.iphone.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DailyDoList
  DailyDoListUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dailydolist.iphone.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DailyDoList
schemes:
  DailyDoList:
    build:
      targets:
        DailyDoList: all
    test:
      gatherCoverageData: true
      targets:
        - DailyDoListTests
        - DailyDoListUITests
